 const socials=d.recruit?`<a class="social" href="https://x.com/KAGETORA_Z00" target="_blank" rel="noopener noreferrer" aria-label="Xで掲載について問い合わせる">${SVG_X}</a>`:socialMarkup(d);

 const desc=d.recruit?'NIKKE UNION MATCHを一緒に盛り上げていただけるYouTuber・配信者・NIKKEクリエイター様を募集しています。\n\n掲載をご希望の方は、Xからお気軽にご連絡ください。':(d.description||'NIKKE UNION MATCH 応援クリエイター');
 const extra=d.recruit?'':[
    safeLink(d.union_match_video_url)?`<a href="${esc(safeLink(d.union_match_video_url))}" target="_blank" rel="noopener noreferrer">UNION MATCH 紹介動画</a>`:'',
    safeLink(d.union_match_x_url)?`<a href="${esc(safeLink(d.union_match_x_url))}" target="_blank" rel="noopener noreferrer">UNION MATCH 紹介投稿</a>`:''
  ].filter(Boolean).join('');
 el.innerHTML=`<div class="composition"><div class="figure">${image}</div><section class="plate" aria-label="${esc(d.creator_name)} の紹介"><div class="plate-body"><div class="profile">${d.recruit?'':`<span class="avatar-shell">${avatar}</span>`}<div class="identity"><h2>${esc(d.creator_name)}</h2>${role}</div></div><div class="cr-rule"></div><div class="cr-label">ABOUT</div><div class="cr-description" tabindex="0">${esc(desc)}</div>${extra?`<div class="cr-links-extra">${extra}</div>`:''}<div class="cr-footer"><div class="cr-footer-label"><span>CONNECT</span><b>${d.recruit?'掲載についてお問い合わせ':'公式リンク'}</b></div><div class="socials">${socials}</div></div></div><button class="close" type="button" aria-label="カードを閉じる">${ICON_CLOSE}</button></section><div class="caption"><span class="caption-kicker">${d.recruit?'CREATORS WANTED':'FEATURED CREATOR'}</span><strong>${esc(d.creator_name)}</strong></div></div>`;
 const closeBtn=el.querySelector('.close');closeBtn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();close()});
 el.addEventListener('click',e=>{if(performance.now()<skipClick||e.target.closest('a,button,.cr-description'))return;if(i!==current){go(i);return}if(!expanded)open();});
 el.addEventListener('keydown',e=>{if(e.target!==el)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();if(i!==current)go(i);else if(!expanded)open()}});
 el.addEventListener('pointerleave',()=>{if(i===current)resetTilt()});return el;
}
function delta(i){let d=(i-current+nodes.length)%nodes.length;if(d>nodes.length/2)d-=nodes.length;return d}
function position(){if(!nodes.length)return;const w=stage.clientWidth,sh=nodes[0].offsetHeight,sw=nodes[0].offsetWidth,mob=w<=600,tab=w<=1024,scale=mob?.63:tab?.74:.78;const charPeek=mob?48:tab?122:Math.min(295,Math.max(225,w*.17));
 nodes.forEach((el,i)=>{const d=delta(i),visible=Math.abs(d)<=1;let tx=0,ty=0;
  if(Math.abs(d)===1){const img=el.querySelector('.figure img');const itemLeft=img?img.offsetLeft-img.offsetWidth*.39:sw*.3;const itemRight=itemLeft+(img?img.offsetWidth:sw*.4);const center=d===-1?charPeek-(itemRight-sw/2)*scale:w-charPeek-(itemLeft-sw/2)*scale;tx=center-w/2;ty=(d===-1?-.43:.43)*sh*(1-scale)}else if(d!==0){tx=Math.sign(d)*(w+sw)}
  el.dataset.slot=visible?String(d):'hidden';el.classList.toggle('is-open',d===0&&expanded);
  el.style.setProperty('--tx',tx.toFixed(1)+'px');el.style.setProperty('--ty',ty.toFixed(1)+'px');el.style.setProperty('--scale',d===0?'1':scale);el.style.setProperty('--a',visible?(d===0?'1':'.93'):'0');el.style.setProperty('--z',d===0?'30':'3');el.tabIndex=visible&&d===0?0:-1;el.setAttribute('aria-hidden',visible?'false':'true');el.setAttribute('aria-expanded',String(d===0&&expanded));
 });}
function stopAuto(){if(timer){clearInterval(timer);timer=null}}
function startAuto(){stopAuto();if(!expanded&&!hover&&!document.hidden&&!matchMedia('(prefers-reduced-motion: reduce)').matches)timer=setInterval(()=>go(current+1),6200)}
function resetTilt(){nodes.forEach(n=>{n.style.removeProperty('--tiltX');n.style.removeProperty('--tiltY')})}
function open(){if(expanded)return;expanded=true;resetTilt();position();stopAuto()}
function close(){if(!expanded)return;expanded=false;resetTilt();position();startAuto()}
function go(i){if(!nodes.length)return;const next=(i+nodes.length)%nodes.length;if(next===current)return;resetTilt();current=next;position();startAuto()}
async function load(){try{
 const [r,s]=await Promise.all([sb.from('creators').select('id,creator_name,icon_url,youtube_url,x_url,union_match_video_url,union_match_x_url,description,display_order,created_at,gallery_image_url,gallery_role,gallery_offset_x,extra_links').eq('is_public',true).order('display_order',{ascending:true}).order('created_at',{ascending:false}),sb.from('creator_gallery_settings').select('image_url,offset_x').eq('id','recruitment').maybeSingle()]);
 if(r.error)throw r.error;if(s.error)throw s.error;
 const data=[...(r.data||[]),{recruit:true,creator_name:'応援クリエイター募集中',gallery_image_url:s.data?.image_url||'',gallery_offset_x:s.data?.offset_x??50}];
 nodes=data.map(makeCard);stage.replaceChildren(...nodes);const images=nodes.map(el=>el.querySelector('.figure img')).filter(Boolean);
 await Promise.all(images.map(im=>im.decode().catch(()=>{})));expanded=true;position();requestAnimationFrame(position);status.hidden=true;stopAuto();
 }catch(e){console.error('CREATORS_GALLERY_LOAD_ERROR',e);status.textContent='クリエイター情報を読み込めませんでした。';status.hidden=false}}
stage.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){hover=true;stopAuto()}});
stage.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){hover=false;resetTilt();startAuto()}});
stage.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||expanded||!matchMedia('(hover:hover) and (pointer:fine)').matches)return;const el=nodes[current];if(!el||!el.contains(e.target)){resetTilt();return}const r=el.getBoundingClientRect(),x=Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width*.38))),y=Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height*.38)));el.style.setProperty('--tiltX',(-y*2.6).toFixed(2)+'deg');el.style.setProperty('--tiltY',(x*3.2).toFixed(2)+'deg')},{passive:true});
stage.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey||matchMedia('(pointer:coarse)').matches)return;const scroll=e.target.closest('.cr-description');if(scroll&&e.deltaY&&scroll.scrollHeight>scroll.clientHeight){const before=scroll.scrollTop;scroll.scrollTop+=e.deltaY;if(scroll.scrollTop!==before){e.preventDefault();return}}
 const dx=Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX;if(Math.abs(dx)<1)return;e.preventDefault();const now=performance.now();if(now-lastWheel>330)wheelTotal=0;lastWheel=now;if(now-stepAt<900)return;wheelTotal+=e.deltaMode===1?dx*18:dx;if(Math.abs(wheelTotal)<40)return;const sign=Math.sign(wheelTotal);wheelTotal=0;stepAt=now;go(current+sign)},{passive:false});
stage.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('a,button')){touchStart=null;return}const sc=e.target.closest('.cr-description');touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY,sc,scrollTop:sc?.scrollTop||0,handled:false}},{passive:true});
stage.addEventListener('touchmove',e=>{if(!touchStart||!touchStart.sc)return;const dx=e.touches[0].clientX-touchStart.x,dy=e.touches[0].clientY-touchStart.y;if(Math.abs(dy)<=Math.abs(dx)||Math.abs(dy)<6)return;const sc=touchStart.sc;if(sc.scrollHeight>sc.clientHeight){e.preventDefault();sc.scrollTop=touchStart.scrollTop-dy;touchStart.handled=true}},{passive:false});
stage.addEventListener('touchcancel',()=>{touchStart=null},{passive:true});
stage.addEventListener('touchend',e=>{if(!touchStart||!e.changedTouches.length)return;const t=touchStart;touchStart=null;if(t.handled)return;const dx=e.changedTouches[0].clientX-t.x,dy=e.changedTouches[0].clientY-t.y;if(t.sc&&Math.abs(dy)>Math.abs(dx)&&t.sc.scrollHeight>t.sc.clientHeight)return;const primary=Math.abs(dx)>Math.abs(dy)?dx:dy;if(Math.abs(primary)<43)return;skipClick=performance.now()+420;go(current+(primary<0?1:-1))},{passive:true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();else if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(current-1);else if(e.key==='ArrowRight'||e.key==='ArrowDown')go(current+1)});
window.addEventListener('resize',position);document.addEventListener('visibilitychange',startAuto);
load();

</script>
