<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f2f5f7">
  <title>NIKKE UNION MATCH - ユニオンリスト</title>
  <meta name="description" content="NIKKE UNION MATCHを現在利用中のユニオン一覧です。募集中のユニオンは募集記事から応募できます。">

  <link rel="stylesheet" href="../style.css?v=51.8">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap">
  <style>
    body {
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .union-list-topbar {
      z-index: 120;
    }

    .union-list-brand-label {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #fff;
      font: 700 22px/1 "Teko", "Zen Kaku Gothic New", sans-serif;
      letter-spacing: .12em;
    }

    .union-list-brand-label {
      text-decoration: none;
      cursor: pointer;
    }

    .union-list-brand-label:hover,
    .union-list-brand-label:focus-visible {
      color: #fff;
      opacity: .82;
    }

    .site-menu-button {
      width: 46px;
      height: 46px;
      display: grid;
      place-content: center;
      gap: 5px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .site-menu-button span {
      display: block;
      width: 25px;
      height: 2px;
      border-radius: 99px !important;
      background: #fff;
      transition: transform .22s ease, opacity .22s ease;
    }

    body.menu-open .site-menu-button span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    body.menu-open .site-menu-button span:nth-child(2) {
      opacity: 0;
    }

    body.menu-open .site-menu-button span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .site-menu-backdrop {
      position: fixed;
      inset: 66px 0 0;
      z-index: 108;
      background: rgba(0,0,0,.22);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .site-menu-drawer {
      position: fixed;
      top: 66px;
      right: 0;
      z-index: 110;
      width: min(86vw, 340px);
      height: calc(100dvh - 66px);
      padding: 12px;
      transform: translateX(105%);
      overflow-y: auto;
      background: rgba(13,16,22,.93);
      border-left: 1px solid rgba(255,255,255,.12);
      box-shadow: -12px 0 34px rgba(0,0,0,.20);
      backdrop-filter: blur(14px) saturate(118%);
      -webkit-backdrop-filter: blur(14px) saturate(118%);
      transition: transform .24s ease;
    }

    body.menu-open .site-menu-drawer {
      transform: translateX(0);
    }

    .site-menu-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding: 0 6px 10px;
      color: rgba(255,255,255,.70);
      font: 800 12px "Teko", sans-serif;
      letter-spacing: .24em;
    }

    .site-menu-head button {
      width: 38px;
      height: 38px;
      border: 0;
      color: #fff;
      background: transparent;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .site-menu-drawer > a {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      border: 0;
      border-bottom: 1px solid rgba(255,255,255,.10);
      color: #fff;
      background: transparent;
      font-size: 14px;
      font-weight: 800;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }

    .site-menu-drawer > a:hover,
    .site-menu-drawer > a:active {
      color: var(--cyan);
      background: rgba(255,255,255,.06);
    }

    .site-menu-drawer > a.current-page {
      color: #fff;
      background: rgba(26,176,241,.15);
      box-shadow: inset 3px 0 0 var(--cyan);
    }

    .site-menu-disclaimer {
      margin: 22px 8px 8px;
      padding: 14px 10px 0;
      border-top: 1px solid rgba(255,255,255,.12);
      color: rgba(255,255,255,.48);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.7;
    }

    .union-list-page {
      width: 100%;
      max-width: 1380px;
      margin: 0 auto;
      padding: 30px 18px 60px;
    }

    .union-list-toolbar {
      margin-top: 0;
      padding: 15px 16px 16px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow-soft);
    }
    .union-list-summary {
      margin: 0 0 12px;
      min-height: 20px;
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 4px;
      flex-wrap: wrap;
      color: #777e85;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.5;
      text-align: right;
    }
    .union-list-summary strong {
      color: #079ed8;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .union-list-summary .sep { color: #c4c8cc; padding: 0 4px; }
    .union-list-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      align-items: stretch;
    }
    .union-list-rank-select {
      position: relative;
      min-width: 0;
    }
    .union-list-rank-select label {
      position: absolute;
      z-index: 1;
      left: 12px;
      top: 5px;
      pointer-events: none;
      color: #868b91;
      font-size: 9px;
      font-weight: 600;
      line-height: 1.2;
    }
    .union-list-rank-select select {
      width: 100%;
      height: 47px;
      margin: 0;
      padding: 15px 25px 4px 12px;
      border: 1px solid #b9bfc5;
      border-radius: 0 !important;
      background: #fff;
      color: #292e33;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .union-list-status-btn {
      width: 100%;
      min-width: 0;
      min-height: 47px;
      padding: 0 5px;
      border: 1px solid #b9bfc5;
      border-radius: 0 !important;
      background: #fff;
      color: #3f444a;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      clip-path: none !important;
    }
    .union-list-status-btn.active {
      border-color: var(--cyan);
      background: #f2fbff;
      color: var(--cyan-dark);
      box-shadow: inset 0 -2px 0 var(--cyan);
    }

    /* UNION LIST専用カード: 共通 .card の装飾に依存しない */
    .union-list-grid { margin-top:14px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .union-list-grid article.card.union-card {
      display:flex !important; flex-direction:column; min-width:0; min-height:230px;
      padding:20px 20px 0 !important; overflow:hidden;
      border:1px solid #e1e3e5 !important; border-radius:0 !important;
      background:#fff !important; background-image:none !important;
      box-shadow:none !important; clip-path:none !important; transform:none;
      font-family:"Noto Sans JP",sans-serif;
    }
    .union-list-grid article.card.union-card::before,
    .union-list-grid article.card.union-card::after { content:none !important; display:none !important; }
    /* 登録済み募集画像だけ、カードの内側3pxにごく薄く常時表示する */
    .union-list-grid article.card.union-card {
      position: relative;
      isolation: isolate;
      transition: border-color .25s ease, transform .25s ease, box-shadow .25s ease !important;
    }
    .union-list-grid article.card.union-card > .union-card-watermark {
      position: absolute;
      inset: 3px;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #fff;
    }
    .union-list-grid article.card.union-card > .union-card-watermark img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: .15;
      transition: opacity .25s ease;
    }
    .union-list-grid article.card.union-card > :not(.union-card-watermark) {
      position: relative;
      z-index: 1;
    }
    @media (hover: hover) and (pointer: fine) {
      html:not(.tablet-device) .union-list-grid article.card.union-card > .union-card-watermark img { opacity: .10; }
      .union-list-grid article.card.union-card:hover {
        transform: scale(1.01) !important;
        box-shadow: 0 5px 16px rgba(14, 43, 63, .08) !important;
        z-index: 2;
      }
      .union-list-grid article.card.union-card:hover > .union-card-watermark img { opacity: .15; }
    }
    @media (hover: none), (pointer: coarse) {
      .union-list-grid article.card.union-card { transform: none !important; }
    }
    @media (hover:hover) and (pointer:fine) { .union-list-grid article.card.union-card:hover { border-color:#20b8f4 !important; } }
    .union-list-grid article.card.union-card.is-in-view { border-color:#20b8f4 !important; }
    .union-card-top { display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0; }
    .union-card-top .countdown { margin:0 !important;padding:0 !important;border:0 !important;background:none !important;color:#757c81 !important;font-size:10px !important;font-weight:500 !important;line-height:1.6;white-space:nowrap; }
    .union-card-state { font-size:11px; color:#099bd3; font-weight:700; white-space:nowrap; }
    .union-card.status-closed .union-card-state { color:#848a8e; }
    .union-list-grid .union-card .name { margin:24px 0 12px !important;color:#222428 !important;font-size:clamp(17px,1.45vw,23px) !important;line-height:1.4 !important;font-weight:700 !important;overflow-wrap:anywhere; }
    .union-list-grid .union-card .union-rank { display:inline-block !important;align-self:flex-start;width:auto !important;min-width:0 !important;margin:0 !important;padding:5px 12px !important;font-size:11px !important;font-weight:700 !important;line-height:1.4;clip-path:none !important; }
    .union-list-grid .union-card .x-post-area { margin-top:auto !important;padding:24px 0 0 !important;border:0 !important;background:none !important; }
    .union-list-grid .union-card .x-btn { display:flex !important;align-items:center;justify-content:space-between;width:100%;min-height:50px;padding:12px 0 !important;border:0 !important;border-top:1px solid #e7e7e7 !important;background:transparent !important;color:#272a2d !important;font-family:"Noto Sans JP",sans-serif !important;font-size:12px !important;font-weight:600 !important;text-align:left;clip-path:none !important;box-shadow:none !important;text-decoration:none; }
    .union-list-grid .union-card .x-btn:hover { color:#079ed8 !important; }
    .union-card-no-link { margin-top:auto;padding:24px 0 16px;color:#92979b;font-size:11px; }
    @media screen and (min-width:601px) and (max-width:1024px) { .union-list-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    .union-list-empty,
    .union-list-error,
    .union-list-loading {
      margin-top: 14px;
      padding: 26px 18px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      box-shadow: var(--shadow-soft);
    }

    .union-list-error {
      border-color: rgba(255,83,100,.45);
      color: #d84555;
    }

    .hidden {
      display: none !important;
    }

    .union-list-footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      line-height: 1.8;
      text-align: center;
    }

    .union-list-bottom-nav {
      display: none;
    }

    @media screen and (max-width: 1024px) {


      .union-list-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }

    }

    @media screen and (max-width: 1366px) {
      /*
        Smartphone / Tablet:
        browser viewport itself is locked.
        Header and bottom navigation stay fixed.
        Only the UNION LIST main area scrolls.
      */
      html,
      body,
      html.tablet-device,
      html.tablet-device body {
        width: 100% !important;
        height: 100% !important;
        min-height: 0 !important;
        max-height: 100% !important;
        overflow: hidden !important;
        overscroll-behavior: none !important;
      }

      body,
      html.tablet-device body {
        position: static !important;
        height: 100dvh !important;
        min-height: 0 !important;
        padding: 0 !important;
        touch-action: none !important;
      }

      body > main.union-list-page {
        position: fixed !important;
        top: 64px !important;
        bottom: calc(68px + env(safe-area-inset-bottom)) !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        max-width: 1380px !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        margin: 0 auto !important;
        padding: 30px 18px 60px !important;
        overflow-x: hidden !important;
        overflow-y: auto !important;
        overscroll-behavior-y: contain !important;
        -webkit-overflow-scrolling: touch !important;
        touch-action: pan-y !important;
      }

      .union-list-topbar {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        z-index: 220 !important;
        transform: none !important;
      }

      .union-list-bottom-nav {
        position: fixed !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        z-index: 220 !important;
        height: calc(68px + env(safe-area-inset-bottom));
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0,1fr));
        padding-bottom: env(safe-area-inset-bottom);
        border-top: 1px solid rgba(255,255,255,.12);
        background: rgba(16,18,22,.96);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 -8px 28px rgba(0,0,0,.22);
      }

      .union-list-bottom-nav a {
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 6px 3px 8px;
        color: rgba(255,255,255,.72);
        font-size: 10px;
        font-weight: 900;
        line-height: 1;
        text-align: center;
        text-decoration: none;
      }

      .union-list-bottom-nav .union-nav-icon {
        display: block;
        min-height: 19px;
        color: rgba(255,255,255,.94);
        font: 800 21px/.9 "Teko", "Zen Kaku Gothic New", sans-serif;
      }

      .union-list-bottom-nav .union-nav-label {
        display: block;
        font-size: 10px;
        font-weight: 900;
        white-space: nowrap;
      }

      @media (hover:hover) and (pointer:fine) {
        .union-list-bottom-nav > a:hover,
        .union-list-bottom-nav > a:hover .union-nav-icon { color:#20b8f4; }
      }

      .union-list-page {
        padding-bottom: 86px;
      }
    }


    /* ========================================
       BOT / CREATOR とナビゲーション基本構成を統一
       - PC / Tablet header: 64px
       - Smartphone header: 58px
     ======================================== */

    .union-list-topbar {
      height: 64px !important;
      padding: 0 20px !important;
      border-bottom: 1px solid rgba(255,255,255,.07) !important;
      background: rgba(8,9,12,.92) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: none !important;
    }

    .union-list-brand-label {
      gap: 0;
      font: 700 22px/1 "Teko", "Zen Kaku Gothic New", sans-serif;
      letter-spacing: .16em;
    }

    .site-menu-backdrop {
      inset: 64px 0 0;
    }

    .site-menu-drawer {
      top: 64px;
      height: calc(100dvh - 64px);
    }

    @media screen and (max-width: 600px) {
      .union-list-topbar {
        height: 58px !important;
        padding: 0 12px !important;
      }



      body > main.union-list-page {
        top: 58px !important;
        bottom: calc(68px + env(safe-area-inset-bottom)) !important;
        padding: 14px 8px 40px !important;
      }

      .union-list-brand-label {
        font-size: 19px;
      }

      .site-menu-backdrop {
        inset: 58px 0 0;
      }

      .site-menu-drawer {
        top: 58px;
        height: calc(100dvh - 58px);
      }



      .union-list-grid {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .union-list-toolbar { padding: 12px 8px; }
      .union-list-controls { gap: 5px; }
      .union-list-status-btn { font-size: 11px; padding: 0 3px; }
      .union-list-rank-select select { font-size: 11px; padding-left: 8px; }
      .union-list-rank-select label { left: 8px; }
      .union-list-summary { font-size: 10px; }
      .union-list-summary strong { font-size: 13px; }
    }

    html.tablet-device .union-list-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    @media screen and (max-width:600px) {
      .union-list-grid,html.tablet-device .union-list-grid {grid-template-columns:1fr;}
      .union-list-grid article.card.union-card {min-height:210px;padding:18px 17px 0 !important;}
      .union-card-top .countdown {font-size:9px !important;}
    }
  </style>
</head>

<body>

  <aside
    id="siteMenuDrawer"
    class="site-menu-drawer"
    aria-hidden="true"
  >
    <div class="site-menu-head">

        id="siteMenuClose"
        type="button"
        aria-label="メニューを閉じる"
      >×</button>

    <a href="../index.html#videoHero">TOP</a>

      <span class="union-nav-icon" aria-hidden="true">⌕</span>
      <span class="union-nav-label">募集を見る</span>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    function closeSiteMenu() {
      document.body.classList.remove("menu-open");
      const button = document.getElementById("siteMenuButton");
      const drawer = document.getElementById("siteMenuDrawer");
      const backdrop = document.getElementById("siteMenuBackdrop");

      button?.setAttribute("aria-expanded", "false");
      drawer?.setAttribute("aria-hidden", "true");

      if (backdrop) {
        backdrop.hidden = true;
      }
    }

    function openSiteMenu() {
      document.body.classList.add("menu-open");
      const button = document.getElementById("siteMenuButton");
      const drawer = document.getElementById("siteMenuDrawer");
      const backdrop = document.getElementById("siteMenuBackdrop");

      button?.setAttribute("aria-expanded", "true");
      drawer?.setAttribute("aria-hidden", "false");

      if (backdrop) {
        backdrop.hidden = false;
      }
    }

    document
      .getElementById("siteMenuButton")
      ?.addEventListener("click", () => {
        if (document.body.classList.contains("menu-open")) {
          closeSiteMenu();
        } else {
          openSiteMenu();
        }
      });

    document
      .getElementById("siteMenuClose")
      ?.addEventListener("click", closeSiteMenu);

    document
      .getElementById("siteMenuBackdrop")
      ?.addEventListener("click", closeSiteMenu);

    document
      .querySelectorAll("#siteMenuDrawer a")
      .forEach(link => {
        link.addEventListener("click", closeSiteMenu);
      });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeSiteMenu();
      }
    });
  </script>

  <script>
    const SUPABASE_URL =
      "https://igoekrvpgnjberppiawf.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_xSjnNTnh667o9IesU5g5Kw_xcdg9bbh";

    const sb =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );

    const state = {
      items: [],
      status: "all"
    };

    const $ = selector =>
      document.querySelector(selector);

    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        char => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char])
      );
    }

    function safeUrl(value) {
      try {
        const url = new URL(String(value || "").trim());

        if (
          url.protocol !== "https:"
          &&
          url.protocol !== "http:"
        ) {
          return "";
        }

        return url.href;
      } catch {
        return "";
      }
    }

    function isRecruiting(recruitment) {
      if (!recruitment) {
        return false;
      }

      const expires =
        new Date(recruitment.expires_at).getTime();

      return (
        String(recruitment.status || "").toLowerCase() === "open"
        &&
        Number.isFinite(expires)
        &&
        expires > Date.now()
      );
    }

    function getMembershipCountdown(expiresAt) {
      const expires =
        new Date(expiresAt).getTime();

      const diff =
        expires - Date.now();

      if (
        !Number.isFinite(expires)
        ||
        diff <= 0
      ) {
        return "⏳ 残り 0日 0時間 0分";
      }

      const totalMinutes =
        Math.max(
          0,
          Math.floor(diff / 60000)
        );

      const days =
        Math.floor(
          totalMinutes / (24 * 60)
        );

      const hours =
        Math.floor(
          (totalMinutes % (24 * 60)) / 60
        );

      const minutes =
        totalMinutes % 60;

      return `⏳ 残り ${days}日 ${hours}時間 ${minutes}分`;
    }


    function updateMembershipCountdowns() {
      let hasExpired = false;

      document
        .querySelectorAll(
          "[data-member-expires]"
        )
        .forEach(element => {
          const expiresAt =
            element.dataset.memberExpires;

          const expires =
            new Date(expiresAt).getTime();

          if (
            Number.isFinite(expires)
            &&
            expires <= Date.now()
          ) {
            hasExpired = true;
          }

          element.textContent =
            getMembershipCountdown(expiresAt);
        });

      if (hasExpired) {
        loadUnions();
      }
    }


    function getUnionRankClass(rank) {
      const classes = {
        "チャレンジャー": "challenger",
        "ダイヤ": "diamond",
        "プラチナ": "platinum",
        "ゴールド": "gold",
        "シルバー": "silver",
        "駆け出しユニオン": "rookie"
      };

      return classes[String(rank || "")] || "default";
    }

    function render() {
      const grid = $("#unionGrid");
      const empty = $("#emptyState");
      const summary = $("#summary");
      const rank =
        String($("#rankFilter")?.value || "");

      let filtered =
        state.items.filter(item => {
          if (
            rank
            &&
            String(item.union_rank || "") !== rank
          ) {
            return false;
          }

          if (
            state.status === "open"
            &&
            !item._recruiting
          ) {
            return false;
          }

          if (
            state.status === "closed"
            &&
            item._recruiting
          ) {
            return false;
          }

          return true;
        });

      filtered.sort((a, b) => {
        if (a._recruiting !== b._recruiting) {
          return a._recruiting ? -1 : 1;
        }

        return (
          new Date(b.created_at).getTime()
          -
          new Date(a.created_at).getTime()
        );
      });

      const openCount =
        state.items.filter(
          item => item._recruiting
        ).length;

      const closedCount =
        state.items.length - openCount;

      summary.innerHTML =
        `登録 <strong>${state.items.length}</strong><span class="sep">｜</span>` +
        `募集中 <strong>${openCount}</strong><span class="sep">｜</span>` +
        `募集なし <strong>${closedCount}</strong>`;


      grid.innerHTML = "";

      if (!filtered.length) {
        empty.classList.remove("hidden");
        return;
      }

      empty.classList.add("hidden");

      grid.innerHTML =
        filtered.map(item => {
          const recruiting =
            item._recruiting === true;

          const recruitmentUrl =
            safeUrl(item._recruitment?.x_url || "");

          const rankClass =
            getUnionRankClass(item.union_rank);

          const imageUrl =
            safeUrl(item._recruitment?.preview_image_url || "");
          const watermark = imageUrl
            ? `<div class="union-card-watermark" aria-hidden="true"><img src="${escapeHtml(imageUrl)}" alt="" loading="lazy" decoding="async"></div>`
            : "";

          const button =
            recruiting && recruitmentUrl
              ? `
                <div class="x-post-area">
                  <a
                    class="x-btn"
                    href="${escapeHtml(recruitmentUrl)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    募集記事を開く ↗
                  </a>
                </div>
              `
              : "";

          return `
            <article class="card union-card ${recruiting ? "status-open" : "status-closed"}">
              ${watermark}
              <div class="union-card-top">
                <span class="countdown" data-member-expires="${escapeHtml(item.expires_at || "")}">${escapeHtml(getMembershipCountdown(item.expires_at))}</span>
                <span class="union-card-state">${recruiting ? "● 募集中" : "募集なし"}</span>
              </div>
              <div class="name">${escapeHtml(item.union_name || "--")}</div>
              <div class="union-rank rank-${escapeHtml(rankClass)}">${escapeHtml(item.union_rank || "--")}</div>
              ${button || '<div class="union-card-no-link">現在は募集していません</div>'}
            </article>
          `;
        }).join("");

      updateMembershipCountdowns();
      activateUnionCardsInViewport();
    }

    let unionCardScrollWatcher = null;
    function activateUnionCardsInViewport() {
      if (unionCardScrollWatcher) {
        unionCardScrollWatcher.disconnect();
        unionCardScrollWatcher = null;
      }
      const cards = [...document.querySelectorAll(".union-list-grid article.union-card")];
      if (!cards.length || !window.matchMedia("(hover:none), (pointer:coarse)").matches) return;
      // Mobile/tablet scrolls inside main, while the window itself is fixed.
      const scrollArea = document.querySelector("main.union-list-page");
      let queued = false;
      const update = () => {
        queued = false;
        const scrollRect = scrollArea && getComputedStyle(scrollArea).overflowY !== "visible"
          ? scrollArea.getBoundingClientRect() : { top:0, bottom:window.innerHeight };
        const centerY = (scrollRect.top + scrollRect.bottom) / 2;
        let closest = null;
        let distance = Infinity;
        for (const card of cards) {
          const rect = card.getBoundingClientRect();
          if (rect.bottom <= scrollRect.top || rect.top >= scrollRect.bottom) continue;
          const d = Math.abs((rect.top + rect.bottom) / 2 - centerY);
          if (d < distance) { distance = d; closest = card; }
        }
        // At scroll limits the viewport midpoint can still favor an inner row.
        // Always highlight the first/last row at the respective scroll edge.
        if (scrollArea && getComputedStyle(scrollArea).overflowY !== "visible") {
          const maxScroll = Math.max(0, scrollArea.scrollHeight - scrollArea.clientHeight);
          if (scrollArea.scrollTop <= 8) {
            closest = cards[0];
          } else if (maxScroll > 0 && maxScroll - scrollArea.scrollTop <= 8) {
            closest = cards[cards.length - 1];
          }
        }
        // Two-column tablet layout: highlight both cards in the same grid row.
        // Single-column mobile layout still highlights only the closest card.
        const rowTop = closest ? closest.offsetTop : null;
        cards.forEach(card => card.classList.toggle(
          "is-in-view",
          rowTop !== null && Math.abs(card.offsetTop - rowTop) <= 2
        ));
      };
      const schedule = () => { if (!queued) { queued = true; requestAnimationFrame(update); } };
      if (scrollArea) scrollArea.addEventListener("scroll", schedule, { passive:true });
      window.addEventListener("scroll", schedule, { passive:true });
      window.addEventListener("resize", schedule, { passive:true });
      unionCardScrollWatcher = { disconnect() {
        if (scrollArea) scrollArea.removeEventListener("scroll", schedule);
        window.removeEventListener("scroll", schedule);
        window.removeEventListener("resize", schedule);
      }};
      schedule();
    }

    async function loadUnions() {
      const loading = $("#loadingState");
      const errorBox = $("#errorState");

      loading.classList.remove("hidden");
      errorBox.classList.add("hidden");

      try {
        const countResult =
          await sb.rpc(
            "get_active_union_member_count"
          );

        if (countResult.error) {
          throw countResult.error;
        }

        const nowIso =
          new Date().toISOString();

        const membershipResult =
          await sb
            .from("union_registrations")
            .select(
              "id, union_name, union_rank, recruitment_id, created_at, expires_at"
            )
            .gt(
              "expires_at",
              nowIso
            )
            .order(
              "created_at",
              { ascending: false }
            );

        if (membershipResult.error) {
          throw membershipResult.error;
        }

        const memberships =
          Array.isArray(membershipResult.data)
            ? membershipResult.data
            : [];

        const recruitmentIds =
          [
            ...new Set(
              memberships
                .map(item => item.recruitment_id)
                .filter(Boolean)
                .map(String)
            )
          ];

        let recruitmentMap =
          new Map();

        if (recruitmentIds.length) {
          const recruitmentResult =
            await sb
              .from("union_recruitments")
              .select(
                "id, x_url, preview_image_url, status, created_at, expires_at"
              )
              .in(
                "id",
                recruitmentIds
              );

          if (recruitmentResult.error) {
            throw recruitmentResult.error;
          }

          recruitmentMap =
            new Map(
              (recruitmentResult.data || [])
                .map(item => [
                  String(item.id),
                  item
                ])
            );
        }

        state.items =
          memberships.map(item => {
            const recruitment =
              item.recruitment_id
                ? recruitmentMap.get(
                    String(item.recruitment_id)
                  ) || null
                : null;

            return {
              ...item,
              _recruitment: recruitment,
              _recruiting:
                isRecruiting(recruitment)
            };
          });

        render();

      } catch (error) {
        console.error(
          "ユニオンリスト取得エラー",
          error
        );

        state.items = [];
        $("#summary").textContent =
          "ユニオンを読み込めませんでした。";
        $("#unionGrid").innerHTML = "";
        $("#emptyState").classList.add("hidden");
        errorBox.classList.remove("hidden");
      } finally {
        loading.classList.add("hidden");
      }
    }

    $("#rankFilter")
      ?.addEventListener(
        "change",
        render
      );

    document
      .querySelectorAll(
        ".union-list-status-btn"
      )
      .forEach(button => {
        button.addEventListener(
          "click",
          () => {
            const nextStatus = button.dataset.status || "all";
            state.status = state.status === nextStatus ? "all" : nextStatus;

            document
              .querySelectorAll(
                ".union-list-status-btn"
              )
              .forEach(item =>
                item.classList.toggle(
                  "active",
                  item.dataset.status === state.status
                )
              );
            document.querySelectorAll(".union-list-status-btn").forEach(item => {
              item.setAttribute("aria-pressed", String(item.dataset.status === state.status));
            });

            render();
          }
        );
      });

    loadUnions();

    setInterval(
      updateMembershipCountdowns,
      60 * 1000
    );
  </script>
</body>
