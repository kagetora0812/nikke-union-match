<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <meta name="theme-color" content="#080b12"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <title>
   案内に沿ってかんたん登録 | UNION MATCH
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&amp;family=Teko:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
  <link href="./guide.css?v=20261121-status-safearea-v1" rel="stylesheet"/>
  <link href="../push-notifications/notification-ui.css?v=20261121-visual-align-v2" rel="stylesheet"/>
  <link href="../shared/navigation.css?v=20261121-nav-transparency-v1" rel="stylesheet"/>
  <link href="../subpage-nav.css?v=20261121-visual-align-v2" rel="stylesheet"/>
  <script defer src="../shared/navigation.js?v=20261120-shared-nav-v1"></script>
  <script defer src="../push-notifications/notification-ui.js?v=20261120-menu-single-handler-v1"></script>
  <script defer="" src="./guide.js?v=20261120-forms-final-v4">
  </script>
</head>
 <body class="um-guide-page">
  <div id="umSharedNavigation" data-um-nav-root="../"></div>
  <main class="wrap">
   <div class="heading">
    <div class="heading-row um-form-heading-row">
     <button aria-label="ガイドを閉じる" class="close-guide um-form-heading-button" id="closeGuide" type="button">
      &times; 閉じる
     </button>
     <div class="heading-titles um-form-heading-copy">
      <span class="eyebrow">REGISTER GUIDE</span>
      <h1>案内に沿ってかんたん登録</h1>
     </div>
    </div>
    <p>
     項目を順番に入力するだけ。最後に内容を確認して、そのまま登録へ進めます。
    </p>
   </div>
   <section class="guide-card" id="guideCard">
    <div class="progress">
     <span id="stepLabel">
     </span>
     <span id="stepCount">
     </span>
    </div>
    <div class="track">
     <div id="trackFill">
     </div>
    </div>
    <div class="demo" id="demo">
    </div>
    <div class="description">
     <h2 id="descriptionTitle">
     </h2>
     <div id="descriptionText">
     </div>
    </div>
    <p class="validation-error" hidden="" id="validationError" role="alert">
    </p>
    <div class="controls">
     <button class="btn outline" id="back" type="button">
      &larr; 戻る
     </button>
     <button class="btn primary" id="next" type="button">
      次へ &rarr;
     </button>
    </div>
   </section>
  </main>
  <dialog class="close-dialog" id="closeDialog">
   <h2>
    ガイドを終了しますか？
   </h2>
   <p>
    入力した内容は破棄されます。
   </p>
   <div class="controls">
    <button class="btn outline" id="cancelClose" type="button">
     続ける
    </button>
    <button class="btn primary" id="confirmClose" type="button">
     終了する
    </button>
   </div>
  </dialog>
 </body>
</html>
