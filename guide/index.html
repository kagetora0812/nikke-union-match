<!doctype html>
<html lang="ja">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>
   案内に沿ってかんたん登録 | UNION MATCH
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;family=Teko:wght@500;600&amp;display=swap" rel="stylesheet"/>
  <link href="./guide.css" rel="stylesheet"/>
  <script defer="" src="./guide.js">
  </script>
 </head>
 <body>
  <header class="site-header">
   <a aria-label="UNION MATCH ホーム" class="brand" href="../index.html">
    <img alt="UNION MATCH" src="../assets/union-match-logo-white.png"/>
   </a>
   <button aria-label="ガイドを閉じる" class="close-guide" id="closeGuide" type="button">
    × 閉じる
   </button>
  </header>
  <main class="wrap">
   <div class="heading">
    <span class="eyebrow">
     REGISTER GUIDE
    </span>
    <h1>
     案内に沿ってかんたん登録
    </h1>
    <p>
     項目を順番に入力するだけ。最後に内容を確認して、そのまま登録へ進めます。
    </p>
   </div>
   <section class="guide-card" id="guideCard">
    <div class="progress">
     <span id="stepLabel">
     </span>
     <span id="stepCount">
     </span>
    </div>
    <div class="track">
     <div id="trackFill">
     </div>
    </div>
    <div class="demo" id="demo">
    </div>
    <div class="description">
     <h2 id="descriptionTitle">
     </h2>
     <div id="descriptionText">
     </div>
    </div>
    <p class="validation-error" hidden="" id="validationError" role="alert">
    </p>
    <div class="controls">
     <button class="btn outline" id="back" type="button">
      ← 戻る
     </button>
     <button class="btn primary" id="next" type="button">
      次へ →
     </button>
    </div>
   </section>
  </main>
  <dialog class="close-dialog" id="closeDialog">
   <h2>
    ガイドを終了しますか？
   </h2>
   <p>
    入力した内容は破棄されます。
   </p>
   <div class="controls">
    <button class="btn outline" id="cancelClose" type="button">
     続ける
    </button>
    <button class="btn primary" id="confirmClose" type="button">
     終了する
    </button>
   </div>
  </dialog>
 </body>
</html>
